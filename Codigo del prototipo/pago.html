<!DOCTYPE html>
<html lang="en">

    <head>
		<meta charset="UTF-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

		<title>Método de Pago</title>
		<link rel="stylesheet" href="css/pago.css"/>
    </head>

    <body>
        <div class="container">
            <form action="">
                <div class="row">
                    <div class="column">
                        <h3 class="title">Direccion de Envio</h3>

                        <div class="input-box">
                            <span>Nombre Completo: </span>
                            <input type="name" id="nombre" >
                        </div>

                        <div class="input-box">
                            <span>Email: </span>
                            <input type="email" id="email" placeholder="example@example.com">
                        </div>

                        <div class="input-box">
                            <span>Direccion: </span>
                            <input type="address" id="direccion" placeholder="Beck">
                        </div>

                        <div class="input-box">
                            <span>Celular: </span>
                            <input type="phone" id="telefono" placeholder="1234-5678">
                        </div>
                    </div>

                    <div class="column">
                        <h3 class="title">Pago</h3>

                        <div class="input-box">
                            <span>Cards Accepted: </span>
                            <img src="img/mp.png" alt="">
                        </div>

                        <div class="input-box">
                            <span>Name on Card: </span>
                            <input type="namecard" id="nombreTarjeta" placeholder="Sra. Beck">
                        </div>

                        <div class="input-box">
                            <span>Credit Card Number: </span>
                            <input type="text" id="numeroTarjeta"  placeholder="1111 2222 3333 4444">
                        </div>

                        <div class="input-box">
                            <span>Exp. Month: </span>
                            <input type="month" id="mesExp" placeholder="Abril">
                        </div>

                        <div class="flex">
                            <div class="input-box">
                                <span>CVV: </span>
                                <input type="text" id="cvv" placeholder="123">
                            </div>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn">Submit</button>
            </form>
        </div>

        <script src="js/pago.js"></script>
    </body>
</html>
