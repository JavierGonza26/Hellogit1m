<!DOCTYPE html>
<html>
    <head>
        <title>Puntos de Entrega</title>
        <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
        <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

        <link rel="stylesheet" href="css/delivery.css">

    </head>

<body>

    <div class="delivery-points">
        <h2>Sectores de Entrega</h2>

        <ul>
            <h3 class="lugar" onclick="mostrarEnMapa(12.0755, -86.1611)">UNI RUSB</h3>
            <h3 class="lugar" onclick="mostrarEnMapa(12.13947, -86.22919)">Multicentro Las Americas</h3>
            <h3 class="lugar" onclick="mostrarEnMapa(12.1099146, -86.2303813)">Estatua de Schick</h3>
        </ul>
    </div>

    <div id="map"></div>

    <script>
        const map = L.map('map').setView([0, 0], 2);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        const marker = L.marker([0, 0]).addTo(map);

        function mostrarEnMapa(lat, lng) {
            map.setView([lat, lng], 13);
            marker.setLatLng([lat, lng]);
        }
    </script>

</body>
</html>
