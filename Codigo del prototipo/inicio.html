<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Inicio</title>
    <link rel="stylesheet" href="css/inicio.css">
</head>

<body>
    <div class="container">

        <div class="container-form">
            <form class="sign-in" id="form-login">
                <h2>Iniciar Sesión</h2>

                <div class="social-networks">
                    <ion-icon name="cafe-outline"></ion-icon>
                    <ion-icon name="finger-print-outline"></ion-icon> 
                </div>

                <span>Use su correo y contraseña</span>

                <div class="container-input">
                    <ion-icon name="mail-outline"></ion-icon>
                    <input type="text" placeholder="Email" id="email">
                </div>

                <div class="container-input">
                    <ion-icon name="lock-closed-outline"></ion-icon>
                    <input type="password" placeholder="Password" id="contrasena">
                </div>

                <a href="#">¿Olvidaste tu contraseña?</a>
                <button class="button" type="submit">INICIAR SESIÓN</button>
            </form>
        </div>

        <div class="container-form">
            <form class="sign-up" id="form-registro">
                <h2>Registrarse</h2>

                <div class="social-networks">
                    <ion-icon name="cafe-outline"></ion-icon>
                    <ion-icon name="finger-print-outline"></ion-icon>
                </div>

                <span>Use su correo electrónico para registrarse</span>

                <div class="container-input">
                    <ion-icon name="people-outline"></ion-icon>
                    <input type="text" placeholder="Nombre" id="nombre-registro">
                </div>
                <div id="mensaje-nombre" style="font-size: 13px; margin-top: 5px;"></div>

                <div class="container-input">
                    <ion-icon name="mail-outline"></ion-icon>
                    <input type="text" placeholder="Email" id="email-registro">
                </div>

                <div id="mensaje-correo" style="font-size: 13px; margin-top: 5px;"></div>

                <!--<div class="container-input">
                    <ion-icon name="lock-closed-outline"></ion-icon>
                    <input type="password" placeholder="Password" id="contrasena-registro">
                </div>-->

                <div class="container-input password-container">
                    <ion-icon name="lock-closed-outline"></ion-icon>
                    <input type="password" placeholder="Password" id="contrasena-registro">
                    <span class="toggle-password" data-target="contrasena-registro">👁️</span>
                </div>

                <div id="mensaje-validacion" class="mensaje-validacion" style="font-size: 13px; margin-bottom: 10px;"></div>

                <button class="button" type="submit">REGISTRARSE</button>

                <p id="mensaje-verificacion"></p>
            </form>
        </div>
        
<div class= "container-welcome">

	<div class="welcome-sign-up welcome">
		<h3>Bienvenido!</h3>
		<p>Ingrese sus datos personales para usar todas las funciones del sitio</p>
		<button class="button" id="btn-sign-up">Registrarse</button>
	</div>

	<div class="welcome-sign-in welcome">
		<h3>Hola!</h3>
		<p>Registre con sus datos personales para usar todas las funciones del sitio</p>
		<button class="button" id="btn-sign-in">Iniciar Sesion</button>
	</div>
</div>

    </div>

    

    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <script src="js/inicio.js"></script>
</body>
</html>
