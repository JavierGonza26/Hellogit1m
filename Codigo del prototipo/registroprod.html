<!DOCTYPE html>
<html lang="es">
    <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <title>Gestión de Productos</title>
    <link rel="stylesheet" href="css/registroprod.css" />

    </head>

    <body>

        <h1>Gestión de Productos</h1>

        <div class="formulario">

            <input type="text" id="nombre" placeholder="Nombre del producto">
            <input type="number" id="precio" placeholder="Precio" min="0.01" step="0.01">
            <select id="categoria">
              <option value="" disabled selected>Selecciona una categoría</option>
            </select>
            <input type="number" id="stock" placeholder="Stock disponible">
            <input type="text" id="imagen" placeholder="URL de la imagen">
            <img id="previewImagen" src="" alt="Previsualización Imagen" style="max-width:150px; max-height:150px; display:none; margin-top:10px;">

            <button id="btnGuardar" onclick="agregarProducto()">Agregar Producto</button>
        
        </div>

        <div class="productos" id="listaProductos"></div>

        <script src="js/registroprod.js"></script>

    </body>
</html>
